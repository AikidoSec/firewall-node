name: 🕵️ End to end tests

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 20.x
            mode: "old"
          - node-version: 22.x
            mode: "old"
          - node-version: 24.x
            mode: "old"
          - node-version: 24.x
            mode: "new"
          - node-version: 25.x
            mode: "new"
          - node-version: 26.x
            mode: "new"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
          check-latest: true

      - name: Setup Aikido safe-chain
        run: |
          # Pinned to specific version v1.0.0 instead of mutable 'latest'
          SAFE_CHAIN_VERSION="v1.0.0"
          SCRIPT_URL="https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh"
          SCRIPT_PATH="/tmp/install-safe-chain.sh"
          # SHA256 checksum of install-safe-chain.sh for v1.0.0
          # Verify this matches: curl -fsSL "${SCRIPT_URL}" | sha256sum
          EXPECTED_CHECKSUM="a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3"
          
          curl -fsSL "${SCRIPT_URL}" -o "${SCRIPT_PATH}"
          ACTUAL_CHECKSUM=$(sha256sum "${SCRIPT_PATH}" | awk '{print $1}')
          
          if [ "${ACTUAL_CHECKSUM}" != "${EXPECTED_CHECKSUM}" ]; then
            echo "ERROR: Checksum verification failed for safe-chain install script"
            echo "Expected: ${EXPECTED_CHECKSUM}"
            echo "Actual:   ${ACTUAL_CHECKSUM}"
            rm -f "${SCRIPT_PATH}"
            exit 1
          fi
          
          sh "${SCRIPT_PATH}" --ci
          rm -f "${SCRIPT_PATH}"

      - name: Downgrade npm for v24 and v25
        # https://github.com/npm/cli/issues/8669
        if: ${{ matrix.node-version == '24.x' || matrix.node-version == '25.x' || matrix.node-version == '26.x' }}
        run: npm i -g npm@11.6.0

      - name: Add local.aikido.io to /etc/hosts
        run: |
          sudo echo "127.0.0.1 local.aikido.io" | sudo tee -a /etc/hosts

      - name: Run Containers
        run: npm run containers

      - name: Install dependencies (end-to-end only)
        run: npm run install-e2e-only

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firewall-node-library-${{ github.sha }}

      - name: Run end-to-end tests
        if: matrix.mode == 'old'
        run: npm run end2end

      - name: Run new end-to-end tests
        if: matrix.mode == 'new'
        run: npm run end2end:new
